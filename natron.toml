# === superdex_mesh_cli third-party sources ===============================
# Source/header archives (same pins as superdex's CMake FetchContent and
# ExternalProject), built by toolchains/third_party/ANUBIS. Only the parts
# the build uses are extracted (strip_prefix).
[[toolchain]]
name       = "occt"
deploy_dir = "third_party/occt"
provider   = "git"
[toolchain.options]
repo         = "https://github.com/Open-Cascade-SAS/OCCT.git"
commit       = "a016080bf6738d6aeae020badee4e888ad1540a5"   # tag V7_9_3
version      = "7.9.3"
strip_prefix = "src"
# One include directory for all 8,421 headers, like upstream's inc/ (one -I
# per package is very slow on Windows).
flatten      = { into = "inc", files = ["*.hxx", "*.lxx", "*.gxx", "*.pxx", "*.h"] }

[[toolchain]]
name       = "cgal"
deploy_dir = "third_party/cgal"
provider   = "github"
[toolchain.options]
repo         = "CGAL/cgal"
tag          = "v6.1.1"
asset        = "CGAL-6.1.1-library.tar.xz"
strip_prefix = "CGAL-6.1.1/include"
sha256       = "37e9fffe48a83209b070e1914c6aa0a7bae8076749712ab78b53245e176e0e0e"

# Headers only: boost/ lands in third_party/boost/boost.
[[toolchain]]
name       = "boost"
deploy_dir = "third_party/boost/boost"
provider   = "url"
[toolchain.options]
url          = "https://archives.boost.io/release/1.77.0/source/boost_1_77_0.tar.gz"
strip_prefix = "boost_1_77_0/boost"
sha256       = "5347464af5b14ac54bb945dc68f1dd7c56f0dad7262816b956138fc53bcc0131"

[[toolchain]]
name       = "rapidjson"
deploy_dir = "third_party/rapidjson"
provider   = "git"
[toolchain.options]
repo         = "https://github.com/Tencent/rapidjson.git"
commit       = "7484e06c589873e1ed80382d262087e4fa80fb63"
strip_prefix = "include"

# === hatchling (py_wheel) ==================================================
# The Python build backend `py_wheel` runs to make a package's Python part,
# and what it imports. Each is a pure-Python wheel from PyPI (a zip); the
# rule puts these directories on sys.path. No pip, no network in the build.
[[toolchain]]
name       = "hatchling"
deploy_dir = "hatchling/hatchling"
provider   = "url"
[toolchain.options]
url     = "https://files.pythonhosted.org/packages/32/64/4afe5dd77b2939a93e8c9513f8082dbd049ecba9c1484a379a0f6ae29d6b/hatchling-1.33.0-py3-none-any.whl"
