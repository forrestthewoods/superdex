[build-system]
requires = ["hatchling>=1.26", "hatch-anubis"]
build-backend = "hatchling.build"

[project]
name = "superdex-physics"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
authors = [{name = "SuperDex Team"}]
description = "Physics runtime for SuperDex"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "thirdparty_licenses/**/*"]
dependencies = [
    "imageio[ffmpeg]>=2.36.1",  # Image/video I/O with FFmpeg support for recordings.
    "numpy",
    "pillow",
    "polyscope>=2.5.0,<2.6",
    "pycollada",
    "pyre-extensions",
    "scikit-image",
    "scipy",
    "tabulate",
    "trimesh",
    "typing_extensions",
    "unrealcv",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
double = ["superdex-physics-fp64==1.0.0"]

[project.urls]
Homepage = "https://github.com/facebookresearch/project_superdex"
Repository = "https://github.com/facebookresearch/project_superdex"

[tool.hatch.build.targets.wheel]
packages = ["superdex"]
exclude = ["superdex/physics/internal", "superdex/physics/utils/testing/internal"]

# Anubis builds the native payload; hatch-anubis puts it in the wheel
# (and `anubis run` copies it into .venv for development).
[tool.hatch.build.hooks.anubis]
targets = ["//superdex_physics/libraries/mochi/mochi_physics:mochi_physics_py"]
native_dir = "superdex/physics/_native"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { env = "ANUBIS_MODE" }]

[tool.uv.sources]
hatch-anubis = { path = "/home/user/anubis/python/hatch-anubis" }

[tool.cibuildwheel]
build = "cp312-*"
skip = "*musllinux* *-win32"
test-skip = "*"

[tool.cibuildwheel.linux]
environment-pass = ["http_proxy", "https_proxy", "no_proxy"]
before-all = "yum install -y clang"

[tool.cibuildwheel.linux.environment]
CC = "clang"
CXX = "clang++"

[tool.cibuildwheel.windows]
repair-wheel-command = """delvewheel repair -w {dest_dir} -v {wheel} --ignore-existing \
  --namespace-pkg superdex"""
