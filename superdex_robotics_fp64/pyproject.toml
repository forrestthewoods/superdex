[build-system]
requires = ["hatchling>=1.26", "hatch-anubis"]
build-backend = "hatchling.build"

[project]
name = "superdex-robotics-fp64"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
authors = [{name = "SuperDex Team"}]
description = "Double-precision robotics extension for SuperDex"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "thirdparty_licenses/**/*"]
dependencies = [
    "superdex-physics-fp64==1.0.0",
    "superdex-robotics==1.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/project_superdex"
Repository = "https://github.com/facebookresearch/project_superdex"

[tool.hatch.build.targets.wheel]
packages = ["superdex_robotics_fp64"]

# Anubis builds the native payload; hatch-anubis puts it in the wheel
# (and `anubis run` copies it into .venv for development).
[tool.hatch.build.hooks.anubis]
# The double-precision build of superdex-robotics' extension: build the wheel
# with an fp64 mode, e.g. ANUBIS_MODE=linux_release_fp64.
targets = ["//superdex_robotics:superdex_robotics_py"]
native_dir = "superdex_robotics_fp64/_native"
# superdex-physics-fp64 (a dependency) ships the shared mochi libraries.
exclude_targets = ["//superdex_physics/libraries/mochi/mochi_physics:mochi_physics_py"]
mode_vars = { precision = "double" }

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { env = "ANUBIS_MODE" }]

[tool.cibuildwheel]
build = "cp312-*"
skip = "*musllinux* *-win32"
test-skip = "*"

[tool.cibuildwheel.linux]
environment-pass = ["http_proxy", "https_proxy", "no_proxy"]
before-all = "yum install -y clang"
repair-wheel-command = """auditwheel repair -w {dest_dir} {wheel} \
  --exclude libmochi_physics_double.so --exclude libmochi_pybind_core_double.so --exclude 'libmarl.so*'"""

[tool.cibuildwheel.linux.environment]
CC = "clang"
CXX = "clang++"

[tool.cibuildwheel.macos]
repair-wheel-command = """delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} \
  --ignore-missing-dependencies \
  --exclude libmochi_physics_double.dylib --exclude libmochi_pybind_core_double.dylib --exclude libmarl."""

[tool.cibuildwheel.windows]
repair-wheel-command = """delvewheel repair -w {dest_dir} -v {wheel} --ignore-existing \
  --exclude mochi_physics_double.dll --exclude mochi_pybind_core_double.dll --exclude marl.dll"""

[tool.uv.sources]
hatch-anubis = { path = "/home/user/anubis/python/hatch-anubis" }
